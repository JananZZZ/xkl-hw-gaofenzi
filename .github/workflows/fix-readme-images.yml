name: Fix README Images

on:
  push:
    branches: [main]
    paths:
      - ".image-payload-v2/READY"

permissions:
  contents: write

jobs:
  restore-images:
    if: ${{ github.event.head_commit.message != 'fix: restore README images as JPG' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified JPG originals
        shell: bash
        run: |
          set -euo pipefail
          cat .image-payload-v2/part-* | base64 -d > /tmp/readme-assets.zip
          echo "f48f8d70eee4c4f49093e89a480e572db29eaba6260bfdf55461cb52eeae97c5  /tmp/readme-assets.zip" | sha256sum -c -
          unzip -o /tmp/readme-assets.zip -d assets/

          python3 - <<'PY'
          from pathlib import Path
          expected = {
              'cover.jpg': 99260,
              'overview.jpg': 26981,
              'truth.jpg': 38510,
              'ai-assistant.jpg': 35086,
          }
          for name, size in expected.items():
              p = Path('assets') / name
              data = p.read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert data[:3] == b'\xff\xd8\xff', f'{name}: invalid JPEG header'
              assert data[-2:] == b'\xff\xd9', f'{name}: invalid JPEG trailer'
              print(f'PASS {name}: {len(data)} bytes')
          PY

      - name: Update README and remove corrupted WebP assets
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#assets/cover\.webp#assets/cover.jpg#g' README.md
          sed -i 's#assets/overview\.webp#assets/overview.jpg#g' README.md
          sed -i 's#assets/truth\.webp#assets/truth.jpg#g' README.md
          sed -i 's#assets/ai-assistant\.webp#assets/ai-assistant.jpg#g' README.md
          rm -f assets/cover.webp assets/overview.webp assets/truth.webp assets/ai-assistant.webp
          rm -rf .image-payload .image-payload-v2
          ! grep -q '\.webp' README.md
          test "$(find assets -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 0

      - name: Commit repaired images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets .image-payload .image-payload-v2 || true
          git commit -m "fix: restore README images as JPG"
          git push

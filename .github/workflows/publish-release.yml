name: Publish GitHub Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
      - "RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update release page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v260826.26"
          TITLE="v260826.26 FINAL-FORMULA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file RELEASE_NOTES.md
          fi
